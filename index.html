<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generador de paletas interactivo para Colorfly Studio.">
    <title>Colorfly Studio | Generador de Paletas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="ph ph-paint-brush-broad"></i>
            <h1>Colorfly Studio</h1>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <label for="palette-size">Cantidad:</label>
                <select id="palette-size" aria-label="Seleccionar tamaño de paleta">
                    <option value="6">6 Colores</option>
                    <option value="8">8 Colores</option>
                    <option value="9">9 Colores</option>
                </select>
            </div>
            
            <div class="format-btns" role="group" aria-label="Formato de visualización de color">
                <button id="btn-hex" class="format-btn active" aria-pressed="true" aria-label="Mostrar colores en formato HEX">
                    <i class="ph ph-hash"></i>
                    HEX
                </button>
                <button id="btn-hsl" class="format-btn" aria-pressed="false" aria-label="Mostrar colores en formato HSL">
                    <i class="ph ph-circle-half-tilt"></i>
                    HSL
                </button>
            </div>

            <button id="generate-btn" class="primary-btn" aria-label="Generar nueva paleta de colores">
                <i class="ph ph-magic-wand"></i>
                Generar Paleta
            </button>
        </div>
    </header>

    <main id="palette-container" class="palette-container" aria-live="polite">
    </main>

    <div id="toast-container" class="toast-container" aria-hidden="true" role="alert">
        <div class="toast">
            <i class="ph ph-check-circle"></i>
            <span id="toast-message">Color copiado al portapapeles</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
